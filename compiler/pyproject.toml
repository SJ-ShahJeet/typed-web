[project]
name = "typed-web-compiler"
version = "0.0.1"
description = "Inspects a website once and emits a deterministic Typed Web extractor spec."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "playwright>=1.49",
  "pydantic>=2.9",
  "selectolax>=0.3.27",
]

[project.scripts]
compile = "typed_web_compiler.cli:compile_main"
repair = "typed_web_compiler.cli:repair_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typed_web_compiler"]

[tool.ruff]
line-length = 100
target-version = "py312"
